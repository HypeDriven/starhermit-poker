<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
  <!-- StarHermit Poker: two fanned playing cards and a gold chip on the
       game's dark navy panel colour. Palette from css/style.css :root. -->
  <rect width='64' height='64' rx='13' fill='#101722'/>
  <!-- gold chip, bottom right -->
  <circle cx='46' cy='45' r='12' fill='#e0bd63'/>
  <circle cx='46' cy='45' r='4.5' fill='#101722'/>
  <!-- back card (accent blue), tilted left -->
  <rect x='12' y='13' width='24' height='33' rx='4' fill='#65b8ff'
        transform='rotate(-14 24 29)'/>
  <!-- front card with spade pip, tilted right -->
  <g transform='rotate(9 33 31)'>
    <rect x='21' y='14' width='24' height='33' rx='4' fill='#f2f0e9'/>
    <path d='M33 20 C29.5 25 26 27 26 30.5 A4.6 4.6 0 0 0 31 34.5 L30 38.5 H36 L35 34.5
             A4.6 4.6 0 0 0 40 30.5 C40 27 36.5 25 33 20 Z' fill='#101722'/>
  </g>
</svg>
