<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Poker chip on StarHermit colors: felt green body, light edge notches,
       gold star center. -->
  <circle cx="32" cy="32" r="30" fill="#1f5c40"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0e1420" stroke-width="2"/>
  <!-- edge notches -->
  <g fill="#e8edf5">
    <rect x="29" y="2" width="6" height="8" rx="1"/>
    <rect x="29" y="2" width="6" height="8" rx="1" transform="rotate(60 32 32)"/>
    <rect x="29" y="2" width="6" height="8" rx="1" transform="rotate(120 32 32)"/>
    <rect x="29" y="2" width="6" height="8" rx="1" transform="rotate(180 32 32)"/>
    <rect x="29" y="2" width="6" height="8" rx="1" transform="rotate(240 32 32)"/>
    <rect x="29" y="2" width="6" height="8" rx="1" transform="rotate(300 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#e8edf5" stroke-width="2" opacity="0.85"/>
  <!-- star -->
  <polygon points="32,16 36.1,26.4 47,27 38.6,34 41.4,44.7 32,38.8 22.6,44.7 25.4,34 17,27 27.9,26.4"
           fill="#ffd166" stroke="#0e1420" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
